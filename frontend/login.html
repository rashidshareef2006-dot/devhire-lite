<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — DevHire Lite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-white border-b border-slate-200">
    <nav class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16" aria-label="Main navigation">
      <a href="index.html" class="flex items-center gap-2 font-bold text-lg text-indigo-600">
        <span aria-hidden="true">🚀</span>
        <span>DevHire<span class="text-slate-800">Lite</span></span>
      </a>
      <a href="register.html" class="text-sm font-medium text-slate-700 hover:text-indigo-600">
        New here? <span class="text-indigo-600 font-semibold">Register</span>
      </a>
    </nav>
  </header>

  <main class="flex-1 flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md">

      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8">

        <div class="text-center mb-8">
          <h1 class="text-2xl font-bold text-slate-900">Welcome back 👋</h1>
          <p class="text-slate-600 mt-2 text-sm">Sign in to continue to DevHire Lite</p>
        </div>

        <form id="loginForm" novalidate class="space-y-5">

          <div>
            <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required
              class="input-field" placeholder="you@example.com" />
            <p class="error-msg hidden text-sm text-red-600 mt-1" data-for="email"></p>
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
            <div class="relative">
              <input id="password" name="password" type="password" autocomplete="current-password" required
                class="input-field pr-12" placeholder="••••••••" />
              <button type="button" id="togglePwd" aria-label="Show password"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-700 text-sm">
                👁️
              </button>
            </div>
            <p class="error-msg hidden text-sm text-red-600 mt-1" data-for="password"></p>
          </div>

          <div class="flex items-center justify-between text-sm">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" name="remember" class="rounded text-indigo-600 focus:ring-indigo-500" />
              <span class="text-slate-600">Remember me</span>
            </label>
            <a href="#" class="text-indigo-600 font-medium hover:underline">Forgot password?</a>
          </div>

          <button type="submit"
            class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700
                   focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition">
            Sign In
          </button>

          <div id="formSuccess" class="hidden text-sm text-green-700 bg-green-50 border border-green-200 rounded-xl p-3"></div>
        </form>

        <p class="text-center text-sm text-slate-600 mt-6">
          Don't have an account?
          <a href="register.html" class="text-indigo-600 font-semibold hover:underline">Create one</a>
        </p>
      </div>

      <p class="text-center text-xs text-slate-500 mt-6">
        Demo: use any valid email + 6+ char password
      </p>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
