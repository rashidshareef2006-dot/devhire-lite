<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browse developer jobs on DevHire Lite." />
  <title>Browse Jobs — DevHire Lite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:bg-indigo-600 focus:text-white focus:px-4 focus:py-2 focus:rounded-lg">
    Skip to main content
  </a>

  <!-- HEADER (same as home) -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-slate-200">
    <nav class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8" aria-label="Main navigation">
      <div class="flex items-center justify-between h-16">
        <a href="index.html" class="flex items-center gap-2 font-bold text-lg text-indigo-600">
          <span aria-hidden="true">🚀</span>
          <span>DevHire<span class="text-slate-800">Lite</span></span>
        </a>
        <ul class="hidden md:flex items-center gap-8 text-sm font-medium">
          <li><a href="jobs.html" class="text-indigo-600">Jobs</a></li>
          <li><a href="#" class="hover:text-indigo-600 transition">Companies</a></li>
          <li><a href="#" class="hover:text-indigo-600 transition">About</a></li>
        </ul>
        <div class="hidden md:flex items-center gap-3">
          <a href="login.html" class="px-4 py-2 text-sm font-medium text-slate-700 hover:text-indigo-600">Login</a>
          <a href="register.html" class="px-4 py-2 text-sm font-semibold bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Get Started</a>
        </div>
        <button id="menuBtn" type="button" aria-label="Toggle navigation menu" aria-expanded="false"
          class="md:hidden p-2 rounded-lg hover:bg-slate-100">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
      <ul id="mobileMenu" class="hidden md:hidden pb-4 space-y-2 text-sm font-medium">
        <li><a href="jobs.html" class="block px-3 py-2 rounded-lg bg-slate-100 text-indigo-600">Jobs</a></li>
        <li><a href="login.html" class="block px-3 py-2 rounded-lg hover:bg-slate-100">Login</a></li>
        <li><a href="register.html" class="block px-3 py-2 rounded-lg bg-indigo-600 text-white text-center">Get Started</a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

    <!-- Page header -->
    <div class="mb-8">
      <h1 class="text-3xl sm:text-4xl font-bold text-slate-900">Browse Jobs</h1>
      <p class="text-slate-600 mt-2">
        <span id="jobCount" class="font-semibold text-indigo-600">0</span> jobs found
      </p>
    </div>

    <!-- Search bar -->
    <form id="searchForm" role="search" aria-label="Job search"
      class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row gap-2 mb-8">
      <label for="searchInput" class="sr-only">Search jobs</label>
      <input id="searchInput" type="search" placeholder="Search by title, company, or skill..."
        class="flex-1 px-4 py-3 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <button type="submit" class="px-6 py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700">
        Search
      </button>
    </form>

    <div class="grid lg:grid-cols-4 gap-8">

      <!-- FILTERS SIDEBAR -->
      <aside class="lg:col-span-1">
        <div class="bg-white rounded-2xl border border-slate-200 p-5 sticky top-24">
          <h2 class="font-semibold text-slate-900 mb-4">Filters</h2>

          <!-- Job type -->
          <fieldset class="mb-6">
            <legend class="text-sm font-semibold text-slate-700 mb-2">Job Type</legend>
            <div class="space-y-2 text-sm">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" class="filter-type rounded text-indigo-600 focus:ring-indigo-500" value="Full-time" />
                <span>Full-time</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" class="filter-type rounded text-indigo-600 focus:ring-indigo-500" value="Part-time" />
                <span>Part-time</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" class="filter-type rounded text-indigo-600 focus:ring-indigo-500" value="Contract" />
                <span>Contract</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" class="filter-type rounded text-indigo-600 focus:ring-indigo-500" value="Hybrid" />
                <span>Hybrid</span>
              </label>
            </div>
          </fieldset>

          <!-- Location -->
          <fieldset class="mb-6">
            <legend class="text-sm font-semibold text-slate-700 mb-2">Location</legend>
            <div class="space-y-2 text-sm">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" class="filter-location rounded text-indigo-600 focus:ring-indigo-500" value="Remote" />
                <span>Remote</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" class="filter-location rounded text-indigo-600 focus:ring-indigo-500" value="Bangalore" />
                <span>Bangalore</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" class="filter-location rounded text-indigo-600 focus:ring-indigo-500" value="Hyderabad" />
                <span>Hyderabad</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" class="filter-location rounded text-indigo-600 focus:ring-indigo-500" value="Pune" />
                <span>Pune</span>
              </label>
            </div>
          </fieldset>

          <button id="clearFilters" type="button"
            class="w-full py-2 text-sm font-semibold text-indigo-600 border border-indigo-200 rounded-xl hover:bg-indigo-50">
            Clear all
          </button>
        </div>
      </aside>

      <!-- JOB LIST -->
      <section class="lg:col-span-3" aria-label="Job results">

        <!-- Sort -->
        <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
          <p class="text-sm text-slate-600">
            Showing <span id="shownCount">0</span> results
          </p>
          <div class="flex items-center gap-2">
            <label for="sortBy" class="text-sm text-slate-600">Sort by:</label>
            <select id="sortBy" class="text-sm border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="recent">Most Recent</option>
              <option value="salary-high">Salary: High to Low</option>
              <option value="salary-low">Salary: Low to High</option>
            </select>
          </div>
        </div>

        <!-- Job cards -->
        <div id="jobList" class="grid gap-4"></div>

        <!-- Empty state -->
        <div id="emptyState" class="hidden text-center py-16">
          <p class="text-5xl mb-3">🔍</p>
          <h3 class="text-lg font-semibold text-slate-900">No jobs found</h3>
          <p class="text-slate-600 mt-1">Try changing filters or search terms.</p>
        </div>

        <!-- Pagination -->
        <nav id="pagination" class="mt-8 flex justify-center gap-2" aria-label="Pagination"></nav>
      </section>
    </div>
  </main>

  <footer class="bg-slate-900 text-slate-300 mt-20">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 text-center text-sm text-slate-500">
      © 2025 DevHire Lite. Built with ❤️
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/jobs.js"></script>
</body>
</html>
