<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Details — DevHire Lite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:bg-indigo-600 focus:text-white focus:px-4 focus:py-2 focus:rounded-lg">
    Skip to main content
  </a>

  <!-- HEADER -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-slate-200">
    <nav class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16" aria-label="Main navigation">
      <a href="index.html" class="flex items-center gap-2 font-bold text-lg text-indigo-600">
        <span aria-hidden="true">🚀</span>
        <span>DevHire<span class="text-slate-800">Lite</span></span>
      </a>
      <a href="jobs.html" class="text-sm font-medium text-slate-700 hover:text-indigo-600">← Back to Jobs</a>
    </nav>
  </header>

  <main id="main" class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

    <!-- Job header card -->
    <div class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm">
      <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
        <div>
          <h1 id="jobTitle" class="text-2xl sm:text-3xl font-bold text-slate-900">Loading...</h1>
          <p id="jobCompany" class="text-slate-600 mt-2"></p>
          <div id="jobMeta" class="flex flex-wrap gap-3 mt-4 text-sm text-slate-600"></div>
        </div>
        <button id="applyBtn" type="button"
          class="px-6 py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700
                 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 whitespace-nowrap">
          Apply Now
        </button>
      </div>

      <div id="jobTags" class="flex flex-wrap gap-2 mt-6"></div>
    </div>

    <!-- Description -->
    <section class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 mt-6" aria-labelledby="desc-heading">
      <h2 id="desc-heading" class="text-xl font-semibold text-slate-900 mb-4">Job Description</h2>
      <div id="jobDescription" class="space-y-4 text-slate-700 leading-relaxed"></div>
    </section>

    <!-- Requirements -->
    <section class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 mt-6" aria-labelledby="req-heading">
      <h2 id="req-heading" class="text-xl font-semibold text-slate-900 mb-4">Requirements</h2>
      <ul id="jobRequirements" class="space-y-2 text-slate-700 list-disc pl-5"></ul>
    </section>

    <!-- Apply CTA -->
    <div class="bg-indigo-600 rounded-2xl p-6 sm:p-8 mt-6 text-white text-center">
      <h2 class="text-xl font-bold">Interested in this role?</h2>
      <p class="text-indigo-100 mt-2 text-sm">Apply now and get a response within 3 days.</p>
      <button id="applyBtn2" type="button"
        class="mt-5 px-6 py-3 bg-white text-indigo-700 font-semibold rounded-xl hover:bg-indigo-50">
        Apply Now
      </button>
    </div>

  </main>

  <footer class="bg-slate-900 text-slate-300 mt-20">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 text-center text-sm text-slate-500">
      © 2025 DevHire Lite. Built with ❤️
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/job-detail.js"></script>
</body>
</html>
