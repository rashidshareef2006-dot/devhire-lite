<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — DevHire Lite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <header class="bg-white border-b border-slate-200">
    <nav class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16" aria-label="Main navigation">
      <a href="index.html" class="flex items-center gap-2 font-bold text-lg text-indigo-600">
        <span aria-hidden="true">🚀</span>
        <span>DevHire<span class="text-slate-800">Lite</span></span>
      </a>
      <a href="login.html" class="text-sm font-medium text-slate-700 hover:text-indigo-600">
        Already have an account? <span class="text-indigo-600 font-semibold">Login</span>
      </a>
    </nav>
  </header>

  <main class="flex-1 flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8">

        <div class="text-center mb-8">
          <h1 class="text-2xl font-bold text-slate-900">Create account 🎉</h1>
          <p class="text-slate-600 mt-2 text-sm">Join DevHire Lite in under a minute</p>
        </div>

        <form id="registerForm" novalidate class="space-y-5">

          <div>
            <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required
              class="input-field" placeholder="Rashi Sharma" />
            <p class="error-msg hidden text-sm text-red-600 mt-1" data-for="name"></p>
          </div>

          <div>
            <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required
              class="input-field" placeholder="you@example.com" />
            <p class="error-msg hidden text-sm text-red-600 mt-1" data-for="email"></p>
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required
              class="input-field" placeholder="Min 6 characters" />
            <p class="error-msg hidden text-sm text-red-600 mt-1" data-for="password"></p>
          </div>

          <div>
            <label for="confirmPassword" class="block text-sm font-medium text-slate-700 mb-1">Confirm Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required
              class="input-field" placeholder="Re-enter password" />
            <p class="error-msg hidden text-sm text-red-600 mt-1" data-for="confirmPassword"></p>
          </div>

          <fieldset>
            <legend class="block text-sm font-medium text-slate-700 mb-2">I am a</legend>
            <div class="grid grid-cols-2 gap-3">
              <label class="cursor-pointer">
                <input type="radio" name="role" value="candidate" class="peer sr-only" checked />
                <div class="p-3 text-center text-sm font-medium rounded-xl border border-slate-200
                            peer-checked:border-indigo-600 peer-checked:bg-indigo-50 peer-checked:text-indigo-700
                            hover:bg-slate-50 transition">
                  👨‍💻 Candidate
                </div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="role" value="recruiter" class="peer sr-only" />
                <div class="p-3 text-center text-sm font-medium rounded-xl border border-slate-200
                            peer-checked:border-indigo-600 peer-checked:bg-indigo-50 peer-checked:text-indigo-700
                            hover:bg-slate-50 transition">
                  🏢 Recruiter
                </div>
              </label>
            </div>
          </fieldset>

          <label class="flex items-start gap-2 text-sm text-slate-600 cursor-pointer">
            <input id="terms" type="checkbox" class="mt-0.5 rounded text-indigo-600 focus:ring-indigo-500" />
            <span>I agree to the <a href="#" class="text-indigo-600 hover:underline">Terms</a> and <a href="#" class="text-indigo-600 hover:underline">Privacy Policy</a></span>
          </label>
          <p class="error-msg hidden text-sm text-red-600" data-for="terms"></p>

          <button type="submit"
            class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700
                   focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition">
            Create Account
          </button>

          <div id="formSuccess" class="hidden text-sm text-green-700 bg-green-50 border border-green-200 rounded-xl p-3"></div>
        </form>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
